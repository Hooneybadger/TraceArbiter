name: Bug report
description: Something in the planner, tracefs session, or adapters is wrong
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, sudo passwords, or full tracefs dumps.
        High overrun is not automatically a bug.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - planner / budget
        - tracefs session
        - exec / collector
        - PARSEC adapter
        - CloudSuite adapter
        - analysis / plots
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, TraceArbiter commit SHA, and whether this is a unit fixture or a real ftrace run.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Git commit
      placeholder: 12-character SHA
